# 개발 환경용 Docker Compose (RabbitMQ + Redis)
# 사용법: docker compose -f docker-compose.dev.yml up -d
#  - RabbitMQ 관리 UI: http://localhost:15672 (guest / guest)

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: alaw-rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - alaw-dev-network

  redis:
    image: redis:7-alpine
    container_name: alaw-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - alaw-dev-network

  # AI 서버까지 컨테이너로 띄우려면: docker compose -f docker-compose.dev.yml --profile app up -d
  ai:
    build: .
    container_name: alaw-ai-dev
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq
      - redis
    networks:
      - alaw-dev-network
    profiles:
      - app

networks:
  alaw-dev-network:
    driver: bridge
